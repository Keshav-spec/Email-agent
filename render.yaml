services:
  - type: web
    name: deadline-pilot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: TODAY_ONLY
        value: "True"
      - key: UNREAD_ONLY
        value: "False"
      - key: ALERT_WINDOW_MINUTES
        value: "60"
      - key: PYTHON_VERSION
        value: "3.11.9"
